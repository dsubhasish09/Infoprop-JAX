# @package _global_
# Writes to the global config: env-specific keys live under `env:`, and any
# algorithm values the environment forces go under `algorithm:` (they override
# algorithm/infoprop.yaml because `env` composes after `algorithm` in main.yaml).

env:
  name: Humanoid
  env_name: humanoid

  control_interval: 5
  reward_scale: 1.0
  forward_reward_weight: 1.25
  ctrl_cost_weight: 0.1
  healthy_reward: 5.0
  terminate_when_unhealthy: true
  healthy_z_range: [1.0, 2.0]
  reset_noise_scale: 1e-2
  exclude_current_positions_from_observation: true

  # History parameters for model learning. Humanoid predicts a local floating-base
  # state and carries [yaw, x, y] as integrated context.
  obs_history: 1
  act_history: 0

  # Skip building the MJX pipeline_state during model rollouts (env-side optimisation).
  fast_model_rollout: true

algorithm:
  # Deployment config = best-all-round run from Optuna sweep humanoid_infoprop_v1
  # (study humanoid_infoprop_v1, trial 109, peak eval reward ~21.7k). Chosen over the
  # nominal best t70 (~21.9k) for stability: t109 ends at its peak (100% retention) with
  # a smoother eval curve. These are t109's exact tuned hyperparameters; the seed is
  # supplied per-launch (seed=$RANDOM in the jobscript). num_trials (training length)
  # kept at 50.
  #   target_entropy = target_entropy_coef(0.0) * action_dim(17) = 0.0
  #   discounting     = 1 - one_minus_gamma(0.03)                = 0.97
  num_trials: 50
  model_subsampling: 0.1
  upper_quantile: 0.97
  agent_learning_rate: 0.0002
  utd_ratio: 2
  tune_entropy: true
  target_entropy: 0.0
  model_learning_rate: 0.0005
  model_weight_decay: 2e-06
  patience: 50
  agent_hidden_layer_sizes: [1024, 1024, 1024, 1024, 1024]
  model_hidden_layer_sizes: [256, 256, 256]
  policy_network_layer_norm: true
  model_layer_norm: false
  discounting: 0.97