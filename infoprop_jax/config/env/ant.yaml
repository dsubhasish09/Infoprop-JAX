# @package _global_
# Stock Brax 'ant' adapted via DefaultInfopropWrappable (see envs/quadruped/ant.py):
# model state == observation, no context, reward in model rollouts from the obs-based
# proxy defined alongside the env.

env:
  name: Ant
  env_name: ant
  backend: mjx

  # History parameters for model learning.
  obs_history: 1
  act_history: 0

algorithm:
  # --- data collection (real system) ---
  num_trials: 50

  # --- model rollouts (synthetic data) ---
  model_subsampling: 0.2
  upper_quantile: 0.99

  # --- agent training ---
  agent_learning_rate: 0.001
  agent_hidden_layer_sizes: [1024, 1024, 1024, 1024, 1024]
  policy_network_layer_norm: true
  utd_ratio: 10
  tune_entropy: true
  target_entropy: -4.0

  # --- model training ---
  model_learning_rate: 0.0005
  model_weight_decay: 5e-06
  model_hidden_layer_sizes: [512, 512, 512, 512]
  model_layer_norm: false
  patience: 5

  # --- miscellaneous ---
  discounting: 0.995